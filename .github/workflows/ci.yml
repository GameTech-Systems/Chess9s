name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm validate:rules
      - run: pnpm build
      - run: node scripts/check-dist.mjs
      # The Worker (S52): a broken config or bundle fails the PR, and the rooms play a whole game
      # through `wrangler dev`.
      - run: pnpm worker:check
      - run: pnpm worker:e2e
