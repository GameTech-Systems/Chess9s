# The depth-2 fairness run (decision 0008), split across GitHub-hosted runners (decision 0009).
# Started by hand from the Actions tab. Each shard job plays a fixed, seeded slice of the games
# (game i goes to shard i mod N + 1) and uploads its games; the merge job builds the fairness
# report, keeping the depth-1 run from docs/fairness/<ruleset>.json, and uploads it.
# S59: a 3-player ruleset gets the balance report of decision 0015 the same way; `depths`, `sweep`
# and `mode` also run its depth-1 run, its screening sweep and the greedy-Dragon run on shards.
# S71: `set` changes parameters for every game (one lever screened alone, decision 0020); the
# report is then named <ruleset>.<label>.
name: Sim depth 2

on:
  workflow_dispatch:
    inputs:
      shards:
        description: Shard jobs (1-256). Each must finish within 6 hours; see decision 0009.
        type: number
        default: 20
      games:
        description: Games in the whole run (decision 0008 needs at least 2000).
        type: number
        default: 2000
      ruleset:
        description: Ruleset id in rules/rulesets.
        type: string
        default: draft-2p
      depths:
        description: Search depths, comma-separated (2 for the depth-2 run).
        type: string
        default: '2'
      sweep:
        description: Also change each parameter one at a time (a screening sweep, named <ruleset>-sweep).
        type: boolean
        default: false
      mode:
        description: 3-player rulesets only. greedy-dragon plays the Dragon greedy against searching Kinged players.
        type: choice
        options: [search, greedy-dragon]
        default: search
      set:
        description: Parameters changed for every game, id=value separated by spaces (needs label).
        type: string
        default: ''
      label:
        description: With set, the report is named <ruleset>.<label> (lowercase letters, digits, -).
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: sim-depth2-${{ inputs.ruleset }}-${{ inputs.label }}-${{ inputs.depths }}-${{ inputs.sweep }}-${{ inputs.mode }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.list.outputs.shards }}
      name: ${{ steps.list.outputs.name }}
      args: ${{ steps.list.outputs.args }}
    steps:
      - id: list
        env:
          SHARDS: ${{ inputs.shards }}
          GAMES: ${{ inputs.games }}
          RULESET: ${{ inputs.ruleset }}
          DEPTHS: ${{ inputs.depths }}
          SWEEP: ${{ inputs.sweep }}
          MODE: ${{ inputs.mode }}
          SET: ${{ inputs.set }}
          LABEL: ${{ inputs.label }}
        run: |
          if ! [[ "$SHARDS" =~ ^[1-9][0-9]*$ ]] || [ "$SHARDS" -gt 256 ]; then
            echo "::error::shards must be a whole number from 1 to 256, not $SHARDS"
            exit 1
          fi
          if ! [[ "$GAMES" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::games must be a positive whole number, not $GAMES"
            exit 1
          fi
          if ! [[ "$DEPTHS" =~ ^[1-9][0-9]*(,[1-9][0-9]*)*$ ]]; then
            echo "::error::depths must be whole numbers separated by commas, not $DEPTHS"
            exit 1
          fi
          if ! [[ "$RULESET" =~ ^[a-z0-9-]+$ ]]; then
            echo "::error::ruleset must be a ruleset id, not $RULESET"
            exit 1
          fi
          name="$RULESET"; args="--depths $DEPTHS"
          if [ -n "$SET" ] || [ -n "$LABEL" ]; then
            if ! [[ "$LABEL" =~ ^[a-z0-9]+(-[a-z0-9]+)*$ ]]; then
              echo "::error::set needs a label of lowercase letters, digits and dashes, not $LABEL"
              exit 1
            fi
            set -f
            for pair in $SET; do
              if ! [[ "$pair" =~ ^[a-zA-Z0-9]+(\.[a-zA-Z0-9]+)+=[a-zA-Z0-9-]+$ ]]; then
                echo "::error::each set entry must be id=value, not $pair"
                exit 1
              fi
              args="$args --set $pair"
            done
            if [ -z "$SET" ]; then echo "::error::label needs set"; exit 1; fi
            name="$name.$LABEL"
          fi
          if [ "$SWEEP" = true ]; then name="$name-sweep"; args="$args --sweep"; fi
          if [ "$MODE" = greedy-dragon ]; then name="$name.greedy-dragon"; args="$args --greedy-dragon"; fi
          echo "shards=[$(seq -s , 1 "$SHARDS")]" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "args=$args" >> "$GITHUB_OUTPUT"

  shard:
    needs: plan
    name: Shard ${{ matrix.shard }} of ${{ inputs.shards }}
    runs-on: ubuntu-latest
    # GitHub stops a job at 6 hours. The games stop at 5 h 40 min and keep what they played.
    timeout-minutes: 355
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @chess9s/sim build
      - name: Play the shard's games
        env:
          SHARD: ${{ matrix.shard }}
          SHARDS: ${{ inputs.shards }}
          GAMES: ${{ inputs.games }}
          RULESET: ${{ inputs.ruleset }}
          NAME: ${{ needs.plan.outputs.name }}
          ARGS: ${{ needs.plan.outputs.args }}
        run: |
          set +e
          # ARGS is built in the plan job from checked inputs only; split on spaces on purpose.
          # shellcheck disable=SC2086
          timeout -s INT 340m node packages/sim/dist/cli.js --ruleset "$RULESET" $ARGS \
            --games "$GAMES" --shard "$SHARD/$SHARDS" --out sim-out --name "$NAME"
          code=$?
          set -e
          if [ "$code" -eq 124 ]; then
            echo "::warning::Shard $SHARD reached its time limit; the games it finished are kept"
          elif [ "$code" -ne 0 ]; then
            exit "$code"
          fi
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: shard-${{ matrix.shard }}-of-${{ inputs.shards }}
          path: sim-out/
          if-no-files-found: warn
          retention-days: 30

  merge:
    needs: [plan, shard]
    # Also after a failed shard: the report counts the games there are and names missing shards.
    if: ${{ !cancelled() && needs.plan.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @chess9s/sim build
      - uses: actions/download-artifact@v8
        with:
          pattern: shard-*-of-${{ inputs.shards }}
          path: shards
          merge-multiple: true
      - name: Merge the shards into the fairness report
        env:
          NAME: ${{ needs.plan.outputs.name }}
        run: |
          earlier=()
          if [ -f "docs/fairness/$NAME.json" ]; then earlier=(--with "docs/fairness/$NAME.json"); fi
          node packages/sim/dist/merge.js shards "${earlier[@]}" --out report --name "$NAME"
          cat "report/$NAME.md" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: fairness-report-${{ needs.plan.outputs.name }}
          path: report/
          if-no-files-found: error
          retention-days: 90
