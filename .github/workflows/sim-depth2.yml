# The depth-2 fairness run (decision 0008), split across GitHub-hosted runners (decision 0009).
# Started by hand from the Actions tab. Each shard job plays a fixed, seeded slice of the games
# (game i goes to shard i mod N + 1) and uploads its games; the merge job builds the fairness
# report, keeping the depth-1 run from docs/fairness/<ruleset>.json, and uploads it.
name: Sim depth 2

on:
  workflow_dispatch:
    inputs:
      shards:
        description: Shard jobs (1-256). Each must finish within 6 hours; see decision 0009.
        type: number
        default: 20
      games:
        description: Games in the whole run (decision 0008 needs at least 2000).
        type: number
        default: 2000
      ruleset:
        description: Ruleset id in rules/rulesets.
        type: string
        default: draft-2p

permissions:
  contents: read

concurrency:
  group: sim-depth2-${{ inputs.ruleset }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.list.outputs.shards }}
    steps:
      - id: list
        env:
          SHARDS: ${{ inputs.shards }}
          GAMES: ${{ inputs.games }}
        run: |
          if ! [[ "$SHARDS" =~ ^[1-9][0-9]*$ ]] || [ "$SHARDS" -gt 256 ]; then
            echo "::error::shards must be a whole number from 1 to 256, not $SHARDS"
            exit 1
          fi
          if ! [[ "$GAMES" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::games must be a positive whole number, not $GAMES"
            exit 1
          fi
          echo "shards=[$(seq -s , 1 "$SHARDS")]" >> "$GITHUB_OUTPUT"

  shard:
    needs: plan
    name: Shard ${{ matrix.shard }} of ${{ inputs.shards }}
    runs-on: ubuntu-latest
    # GitHub stops a job at 6 hours. The games stop at 5 h 40 min and keep what they played.
    timeout-minutes: 355
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @chess9s/sim build
      - name: Play the shard's games
        env:
          SHARD: ${{ matrix.shard }}
          SHARDS: ${{ inputs.shards }}
          GAMES: ${{ inputs.games }}
          RULESET: ${{ inputs.ruleset }}
        run: |
          set +e
          timeout -s INT 340m node packages/sim/dist/cli.js --ruleset "$RULESET" --depths 2 \
            --games "$GAMES" --shard "$SHARD/$SHARDS" --out sim-out
          code=$?
          set -e
          if [ "$code" -eq 124 ]; then
            echo "::warning::Shard $SHARD reached its time limit; the games it finished are kept"
          elif [ "$code" -ne 0 ]; then
            exit "$code"
          fi
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: shard-${{ matrix.shard }}-of-${{ inputs.shards }}
          path: sim-out/
          if-no-files-found: warn
          retention-days: 30

  merge:
    needs: [plan, shard]
    # Also after a failed shard: the report counts the games there are and names missing shards.
    if: ${{ !cancelled() && needs.plan.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @chess9s/sim build
      - uses: actions/download-artifact@v8
        with:
          pattern: shard-*-of-${{ inputs.shards }}
          path: shards
          merge-multiple: true
      - name: Merge the shards into the fairness report
        env:
          RULESET: ${{ inputs.ruleset }}
        run: |
          earlier=()
          if [ -f "docs/fairness/$RULESET.json" ]; then earlier=(--with "docs/fairness/$RULESET.json"); fi
          node packages/sim/dist/merge.js shards "${earlier[@]}" --out report --name "$RULESET"
          cat "report/$RULESET.md" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: fairness-report-${{ inputs.ruleset }}
          path: report/
          if-no-files-found: error
          retention-days: 90
