title: "[Playtest] "
labels: ["playtest"]
body:
  - type: markdown
    attributes:
      value: |
        Posting here means your feedback is a Contribution under the Chess Nines CLA (see CLA.md).
  - type: input
    id: ruleset
    attributes:
      label: Ruleset id and version
    validations:
      required: true
  - type: textarea
    id: feedback
    attributes:
      label: What did you notice?
      description: Did either side feel favored? Which moments felt unclear?
    validations:
      required: true
  - type: checkboxes
    id: terms
    attributes:
      label: Contribution terms
      options:
        - label: I agree this feedback is a Contribution under the Chess Nines CLA (CLA.md), and it contains no art, lore or characters.
          required: true
