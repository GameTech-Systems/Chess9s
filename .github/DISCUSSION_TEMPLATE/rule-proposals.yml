title: "[Rule] "
labels: ["rule-proposal"]
body:
  - type: markdown
    attributes:
      value: |
        Posting here means your proposal is a Contribution under the Chess Nines CLA (see CLA.md).
  - type: textarea
    id: idea
    attributes:
      label: The idea
      description: Which piece or rule, and what should change?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why is it fair or better?
    validations:
      required: true
  - type: checkboxes
    id: terms
    attributes:
      label: Contribution terms
      options:
        - label: I agree this proposal is a Contribution under the Chess Nines CLA (CLA.md), and it contains no art, lore or characters.
          required: true
